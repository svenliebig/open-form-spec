openapi: 3.0.3
info:
  title: Profile API
  version: 0.1.0

paths: {}

components:
  schemas:
    Profile:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        birthDate:
          type: string
          format: date
        age:
          type: integer
        score:
          type: number
